name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

jobs:
  self-scan:
    name: Secret scan (this action, on this repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./

  action-catches-a-leak:
    name: Action fails on a planted secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built at runtime from the test fakes; never a literal in this repo.
      - name: Plant a fake secret and a private term
        run: |
          PYTHONPATH=. python3 -c "from tests import fakes; print('token = ' + repr(fakes.github_token()))" > planted.py
          echo "Owner: Northwind Traders" > planted.txt
          git add planted.py planted.txt
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          private-terms: Northwind Traders
          sarif: planted.sarif
      - name: Require failure, findings, and no leaked values
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          test "$OUTCOME" = failure || { echo "::error::the action passed despite a planted secret"; exit 1; }
          python3 - <<'PY'
          import json
          from tests import fakes
          sarif = open("planted.sarif").read()
          results = json.loads(sarif)["runs"][0]["results"]
          # The term also appears in this workflow file, which is correctly flagged too;
          # count only the planted files.
          rules = sorted(
              r["ruleId"]
              for r in results
              if r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"].startswith("planted.")
          )
          assert rules == ["github-token", "private-term"], rules
          assert fakes.github_token() not in sarif and "Northwind" not in sarif
          print("ok:", rules)
          PY

  action-reads-history:
    name: Action finds a secret a later commit removed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A branch that adds a fake secret and removes it again: its end state is
      # clean, but the secret is in the history it would merge.
      - name: Commit a fake secret, then remove it
        id: branch
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name ci && git config user.email ci@example.com
          PYTHONPATH=. python3 -c "from tests import fakes; print('token = ' + repr(fakes.github_token()))" > planted.py
          git add planted.py && git commit -qm plant
          git rm -q planted.py && git commit -qm remove
      - name: The changed files alone show nothing
        uses: ./
        with:
          since: ${{ steps.branch.outputs.base }}
      - id: history
        uses: ./
        continue-on-error: true
        with:
          since: ${{ steps.branch.outputs.base }}
          history: "true"
      - name: Require the history scan to fail, for the removed secret
        env:
          OUTCOME: ${{ steps.history.outcome }}
          BASE: ${{ steps.branch.outputs.base }}
          PYTHONPATH: src
        run: |
          test "$OUTCOME" = failure || { echo "::error::the history scan missed a removed secret"; exit 1; }
          # A failure could also be an error (exit 2); check it's the finding.
          python3 -m secret_scan --no-user-config --history --since "$BASE" --format json > history.json || true
          python3 - <<'PY'
          import json
          found = [(f["path"], f["rule"], f["inHead"]) for f in json.load(open("history.json"))["findings"]]
          assert found == [("planted.py", "github-token", False)], found
          print("ok:", found)
          PY

  benchmark:
    name: Benchmark corpora match their expected findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Public repositories pinned to a commit (benchmarks/corpora.json): TruffleHog's
      # leaked-on-purpose keys must all be found, and nothing new may appear in
      # ordinary code. A diff in either direction fails and names the location.
      - run: python3 scripts/benchmark.py

  test:
    name: Lint, types & tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (locked)
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Tests, with a coverage floor
        run: |
          uv run coverage run -m pytest
          uv run coverage report
      - name: Build
        run: uv build

  test-os:
    # The hook runs on developers' machines, not only on Linux runners.
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest

  # The single check branch protection requires. Listing every job there would
  # mean editing repository settings whenever a job is added or renamed; this
  # fails unless every job it needs succeeded (skipped or cancelled counts as failed).
  ci-passed:
    name: CI passed
    if: always()
    needs: [self-scan, action-catches-a-leak, action-reads-history, benchmark, test, test-os]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a required job did not succeed"; exit 1; }
          done
